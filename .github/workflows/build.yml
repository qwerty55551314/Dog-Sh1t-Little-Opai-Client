name: Build Clients

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [ Amaya-master, Arcane-master, Solitude-master ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build ${{ matrix.client }}
        working-directory: ${{ matrix.client }}
        run: |
          # 自动检测构建工具
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            gradle build
          elif [ -f "pom.xml" ]; then
            mvn clean package -DskipTests
          else
            echo "未找到 Gradle 或 Maven 构建文件，请检查 ${{ matrix.client }} 目录"
            exit 1
          fi

      - name: Copy artifacts to unified folder
        run: |
          mkdir -p build-output/${{ matrix.client }}
          # 同时查找 Gradle (build/libs) 和 Maven (target) 的输出目录
          find ${{ matrix.client }} -path "*/build/libs/*.jar" -exec cp {} build-output/${{ matrix.client }}/ \;
          find ${{ matrix.client }} -path "*/target/*.jar" -exec cp {} build-output/${{ matrix.client }}/ \;
          # 如果以上路径未找到，进行全目录兜底查找
          if [ -z "$(ls -A build-output/${{ matrix.client }}/)" ]; then
            find ${{ matrix.client }} -name "*.jar" -exec cp {} build-output/${{ matrix.client }}/ \;
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}-build
          path: build-output/${{ matrix.client }}/
          retention-days: 7