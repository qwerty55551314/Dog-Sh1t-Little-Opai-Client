name: Build Clients

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 根据仓库实际子目录调整，这里列出了已知的客户端
        client: [ Amaya-master, Arcane-master, Solitude-master ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.client }}
        working-directory: ${{ matrix.client }}
        run: |
          # 如果子项目没有 gradlew 文件，则使用系统 gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Copy artifacts to unified folder
        run: |
          mkdir -p build-output/${{ matrix.client }}
          # 查找 jar 文件并复制到统一目录，可根据实际输出路径调整
          find ${{ matrix.client }} -name "*.jar" -exec cp {} build-output/${{ matrix.client }}/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}-build
          path: build-output/${{ matrix.client }}/
          retention-days: 7