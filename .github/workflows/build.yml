name: Build Clients

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [ Amaya-master, Arcane-master, Solitude-master ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build ${{ matrix.client }}
        working-directory: ${{ matrix.client }}
        run: |
          # 1. 优先使用 gradlew
          GRADLEW_PATH=$(find . -maxdepth 2 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH"
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x ./gradlew
            ./gradlew build
          
          # 2. 其次查找 build.gradle（Gradle）
          elif [ -n "$(find . -maxdepth 2 -name 'build.gradle*' | head -n 1)" ]; then
            echo "Found build.gradle, using system gradle"
            GRADLE_DIR=$(dirname "$(find . -maxdepth 2 -name 'build.gradle*' | head -n 1)")
            cd "$GRADLE_DIR"
            gradle build
          
          # 3. 最后查找 pom.xml（Maven）
          elif [ -n "$(find . -maxdepth 2 -name 'pom.xml' | head -n 1)" ]; then
            echo "Found pom.xml, using Maven"
            MAVEN_DIR=$(dirname "$(find . -maxdepth 2 -name 'pom.xml' | head -n 1)")
            cd "$MAVEN_DIR"
            mvn clean package -DskipTests
          
          else
            echo "Error: No build file found in ${{ matrix.client }} (searched up to 2 levels deep)"
            exit 1
          fi

      - name: Copy artifacts to unified folder
        run: |
          mkdir -p build-output/${{ matrix.client }}
          # 递归查找 jar 文件
          find ${{ matrix.client }} -name "*.jar" -exec cp {} build-output/${{ matrix.client }}/ \;
          # 递归查找 apk 文件（Android 项目）
          find ${{ matrix.client }} -name "*.apk" -exec cp {} build-output/${{ matrix.client }}/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}-build
          path: build-output/${{ matrix.client }}/
          retention-days: 7