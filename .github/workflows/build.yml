name: Build Clients

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [ Amaya-master, Arcane-master, Solitude-master ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 打印目录结构 (调试用)
        run: |
          echo "=== ${{ matrix.client }} 目录树 ==="
          find ${{ matrix.client }} -maxdepth 3 -type f \( -name "*.gradle*" -o -name "*.xml" -o -name "gradlew" \) 2>/dev/null || echo "未找到构建文件"

      - name: Build ${{ matrix.client }}
        working-directory: ${{ matrix.client }}
        run: |
          # 最深查找 4 层，自动定位构建文件
          BUILD_FILE=$(find . -maxdepth 4 \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "pom.xml" \) | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: 在 ${{ matrix.client }} 中未找到任何构建文件，请检查上方的目录树日志。"
            exit 1
          fi
          
          echo "找到构建文件: $BUILD_FILE"
          BUILD_DIR=$(dirname "$BUILD_FILE")
          cd "$BUILD_DIR"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build -x test --no-daemon
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            gradle build -x test --no-daemon
          elif [ -f "pom.xml" ]; then
            mvn clean package -DskipTests
          fi

      - name: Copy artifacts to unified folder
        if: always()
        run: |
          mkdir -p build-output/${{ matrix.client }}
          find ${{ matrix.client }} -name "*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" -exec cp {} build-output/${{ matrix.client }}/ \;
          find ${{ matrix.client }} -name "*.apk" -exec cp {} build-output/${{ matrix.client }}/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}-build
          path: build-output/${{ matrix.client }}/
          retention-days: 7