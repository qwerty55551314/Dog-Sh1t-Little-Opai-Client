name: Build Clients

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [ Amaya-master, Arcane-master, Solitude-master ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Attempt Build or Fallback
        working-directory: ${{ matrix.client }}
        run: |
          # 尝试查找构建文件
          BUILD_FILE=$(find . -maxdepth 4 \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "pom.xml" \) | head -n 1)
          
          if [ -n "$BUILD_FILE" ]; then
            echo "✅ 找到构建文件: $BUILD_FILE，开始尝试编译..."
            BUILD_DIR=$(dirname "$BUILD_FILE")
            cd "$BUILD_DIR"
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              ./gradlew build -x test --no-daemon || echo "⚠️ Gradle 编译失败，将回退打包源码"
            elif [ -f "pom.xml" ]; then
              mvn clean package -DskipTests || echo "⚠️ Maven 编译失败，将回退打包源码"
            fi
          else
            echo "❌ 未找到任何构建文件 (Gradle/Maven)，该项目可能是纯源码或特殊结构。"
            echo "📦 将直接打包源码作为产物供下载。"
          fi

      - name: Package Artifacts (Collect JARs & Source ZIP)
        if: always()
        run: |
          mkdir -p build-output/${{ matrix.client }}
          
          # 1. 尝试收集任何现成的 jar 文件
          find ${{ matrix.client }} -name "*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" -exec cp {} build-output/${{ matrix.client }}/ \;
          
          # 2. 将整个客户端目录打包成 ZIP (防止编译失败什么都没拿到)
          echo "正在打包源码..."
          zip -r build-output/${{ matrix.client }}/${{ matrix.client }}-source.zip ${{ matrix.client }} -x "*.git*"
          
          # 3. 打印最终收集到的文件列表
          echo "=== 最终打包产物列表 ==="
          ls -la build-output/${{ matrix.client }}/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}-build
          path: build-output/${{ matrix.client }}/
          retention-days: 7